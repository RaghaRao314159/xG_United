[project]
name = "xg-united"
version = "1.0.0"
description = "xG United - More than a Hack 2027 possession submission"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.15.0",
  "structured-data-models==0.2.1",
  "numpy==2.4.6",
  "pandas==3.1.0",
  "lightgbm==4.7.0",
  "scipy==1.17.1",
  "statsmodels==0.15.0",
  "huggingface-hub==2.4.0",
  "hf-xet==1.8.0",
  "pyarrow==26.0.1",
  "safetensors==0.8.0",
  "patsy==1.0.3",
]

[dependency-groups]
# These two previously unrecorded versions are reconstruction pins, not a claim
# about the historical training machine. Existing trained artifacts are unchanged.
training = ["scikit-learn==1.9.1", "kloppy==3.18.0", "lxml==6.1.3"]
docs = ["reportlab==5.1.0", "pypdf==7.1.0"]

[tool.uv]
package = false
required-version = ">=0.13.6"
